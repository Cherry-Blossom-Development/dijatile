; Waveshare ESP32-S3 LCD boards. Both use an ESP32-S3R8 (8 MB octal PSRAM)
; with 16 MB flash; everything else differs (see lib/Board/src/BoardConfig.h).
;
;   146b  ESP32-S3-Touch-LCD-1.46B  412x412 round, SPD2010 QSPI, PCM5101 DAC
;   154   ESP32-S3-LCD-1.54         240x240 square, ST7789 SPI, ES8311/ES7210
;
; One firmware per board: a launcher plus every app in src/apps and game in
; src/games. Pick the board in VS Code's PlatformIO env switcher (status bar)
; or with `pio run -e 154 -t upload`.
;
; Uses the pioarduino platform (community fork) because the official
; platformio/espressif32 platform is stuck on Arduino-ESP32 2.x, and the
; libraries below (ESP_I2S, ESP32-audioI2S 3.x) need Arduino-ESP32 3.x.

[platformio]
default_envs = 146b

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3

lib_deps =
    moononournation/GFX Library for Arduino @ ^1.6.0
    https://github.com/lewisxhe/SensorLib.git#v0.3.4
    https://github.com/schreibfaul1/ESP32-audioI2S.git#3.4.7

[env:146b]
build_flags = ${env.build_flags} -DBOARD_WS_146B

[env:154]
build_flags = ${env.build_flags} -DBOARD_WS_154
