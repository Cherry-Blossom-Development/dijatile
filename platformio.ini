; Waveshare ESP32-S3 LCD boards. Both use an ESP32-S3R8 (8 MB octal PSRAM)
; with 16 MB flash; everything else differs (see lib/Board/src/BoardConfig.h).
;
;   146b  ESP32-S3-Touch-LCD-1.46B  412x412 round, SPD2010 QSPI, PCM5101 DAC
;   154   ESP32-S3-LCD-1.54         240x240 square, ST7789 SPI, ES8311/ES7210
;
; One firmware per board: a launcher plus every app in src/apps and game in
; src/games. Pick the board in VS Code's PlatformIO env switcher (status bar)
; or with `pio run -e TheSquareOne -t upload`.
;
; Uses the pioarduino platform (community fork) because the official
; platformio/espressif32 platform is stuck on Arduino-ESP32 2.x, and the
; libraries below (ESP_I2S, ESP32-audioI2S 3.x) need Arduino-ESP32 3.x.

[platformio]
default_envs = TheRoundOne
; Per-machine serial ports (see platformio_local.ini.example). Optional.
extra_configs = platformio_local*.ini

; Settings shared by every ESP32 environment.
[esp32]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; Upload to the board with custom_usb_serial (set in platformio_local.ini), wherever
; it is plugged in. See scripts/select_port.py.
extra_scripts = pre:scripts/select_port.py

; The two display tiles (ESP32-S3).
[display_tile]
extends = esp32
board = esp32-s3-devkitc-1

board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L

; src/controls/ is the Controls tile firmware, a different chip.
build_src_filter = +<*> -<controls/>

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3

lib_deps =
    moononournation/GFX Library for Arduino @ ^1.6.0
    https://github.com/lewisxhe/SensorLib.git#v0.3.4
    https://github.com/schreibfaul1/ESP32-audioI2S.git#3.4.7
    ; Mozzi 2.0.4: synthesis engine for Tilt Theremin and Synth (pinned commit)
    https://github.com/sensorium/Mozzi.git#7f1e5b423df8162a7e5e68a4d3dbe583712a41fb

[env:TheRoundOne]
extends = display_tile
build_flags = ${display_tile.build_flags} -DBOARD_WS_146B

[env:TheSquareOne]
extends = display_tile
build_flags = ${display_tile.build_flags} -DBOARD_WS_154

; The Controls tile: ESP32-C3 SuperMini, 0.96" OLED, two encoders, two buttons.
; Wiring and pins are in src/controls/pins.h.
[env:TheControlsOne]
extends = esp32
board = esp32-c3-devkitm-1
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = default.csv
build_src_filter = -<*> +<controls/>
build_flags =
    -DBOARD_CONTROLS_TILE
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
lib_deps =
    olikraus/U8g2 @ ^2.36.5
lib_ignore =
    Board

; Bench test for edge detection on the controls tile: east edge wired straight to
; GPIO 1 (detector) and GPIO 2 (LED), no PCF8574 (see lib/Edge/src/EdgeBoardConfig.h).
; Every control keeps working. Use it with a display tile's edge board touching the
; controls tile.
[env:TheControlsEdgeTest]
extends = env:TheControlsOne
build_flags =
    ${env:TheControlsOne.build_flags}
    -DEDGE_TEST=1

; Host-side unit tests for the pure logic (edge detection core): pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall -Wextra
lib_ignore = Board, Net, ControlsLink
